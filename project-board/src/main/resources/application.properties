spring.application.name=spring-board

spring.devtools.livereload.enabled=true

# TRACE, DEBUG, INFO, WARN, ERROR
logging.level.net.likelion.bebc25=DEBUG


spring.datasource.driver-class-name=org.h2.Driver

#H2 Database Configuration (인메모리/RAM 저장 모드)
#spring.datasource.url=jdbc:h2:mem:spring-board;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE

# H2 Database Configuration (프로젝트 내부 파일 저장 모드 활성화)
spring.datasource.url=jdbc:h2:file:./db/spring-board;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 스프링 구동 시 DB 초기화 스크립트 실행(schema.sql, data.sql)
spring.sql.init.mode=always
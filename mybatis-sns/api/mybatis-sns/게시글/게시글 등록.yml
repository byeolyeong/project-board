info:
  name: 게시글 등록
  type: http
  seq: 2

http:
  method: POST
  url: localhost:8080/api/v1/posts
  headers:
    - name: X-Member-Id
      value: "1"
      description: 임시로 사용하는 회원 ID
  body:
    type: json
    data: |-
      {
        "content": "REST API",
        "imageUrl": "https://example.com/img/spring.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
